<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquran Digidaw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        .font-arabic { font-family: 'Amiri', serif; }
        .font-serif { font-family: 'Lora', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 font-serif min-h-screen flex flex-col">
    <nav class="w-full bg-white border-b border-stone-200 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 md:px-6 py-4 md:h-16 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="index.html" class="font-bold text-lg text-stone-900 tracking-tight">Alquran Digidaw</a>
            <div class="flex flex-wrap justify-center gap-4 md:gap-6 text-sm font-medium">
                <a href="index.html" class="text-stone-900 transition-colors">Surah</a>
                <a href="cari.html" class="text-stone-500 hover:text-stone-900 transition-colors">Pencarian AI</a>
                <a href="shalat.html" class="text-stone-500 hover:text-stone-900 transition-colors">Jadwal Shalat</a>
                <a href="doa.html" class="text-stone-500 hover:text-stone-900 transition-colors">Doa</a>
            </div>
        </div>
    </nav>

    <header class="w-full bg-white border-b border-stone-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 py-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-stone-900 mb-3">Alquran Digidaw</h1>
            <p class="text-stone-500 uppercase tracking-widest text-sm">Daftar Surah & Terjemahan</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 md:px-6 py-12 w-full flex-grow">
        <div id="konten" class="text-stone-500 text-center animate-pulse">
            Memuat daftar surah...
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSurahList();
        });

        async function loadSurahList() {
            try {
                const response = await fetch('https://equran.id/api/v2/surat');
                const data = await response.json();

                let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                data.data.forEach(surah => {
                    html += `
                        <a href="surat.html?nomor=${surah.nomor}" class="group block bg-white p-5 rounded-sm border border-stone-200 shadow-sm hover:shadow-md hover:border-stone-300 transition-all flex justify-between items-center">
                            <div class="flex items-start gap-4">
                                <div class="bg-stone-50 text-stone-700 h-10 w-10 flex items-center justify-center font-semibold text-sm border border-stone-100 rounded-sm shrink-0">
                                    ${surah.nomor}
                                </div>
                                <div class="flex flex-col">
                                    <span class="font-bold text-stone-900 text-lg group-hover:text-stone-700 transition-colors">${surah.namaLatin}</span>
                                    <span class="text-xs text-stone-500 uppercase tracking-widest mt-1">${surah.arti} &middot; ${surah.jumlahAyat} Ayat</span>
                                </div>
                            </div>
                            <div class="text-3xl font-arabic text-stone-800 text-right shrink-0 ml-4" dir="rtl">
                                ${surah.nama}
                            </div>
                        </a>
                    `;
                });
                html += '</div>';

                document.getElementById('konten').innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('konten').innerHTML = '<p class="text-red-700 text-center">Gagal memuat data surah.</p>';
            }
        }
    </script>
</body>
</html>
