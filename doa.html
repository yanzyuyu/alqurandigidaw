<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Doa - Alquran Digidaw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        .font-arabic { font-family: 'Amiri', serif; }
        .font-serif { font-family: 'Lora', serif; }
        /* Masonry fallback using columns */
        .columns-1 { columns: 1; }
        @media (min-width: 768px) { .md\:columns-2 { columns: 2; } }
        .break-inside-avoid { break-inside: avoid; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 font-serif min-h-screen flex flex-col">
    <nav class="w-full bg-white border-b border-stone-200 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 md:px-6 py-4 md:h-16 flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="index.html" class="font-bold text-lg text-stone-900 tracking-tight">Alquran Digidaw</a>
            <div class="flex flex-wrap justify-center gap-4 md:gap-6 text-sm font-medium">
                <a href="index.html" class="text-stone-500 hover:text-stone-900 transition-colors">Surah</a>
                <a href="cari.html" class="text-stone-500 hover:text-stone-900 transition-colors">Pencarian AI</a>
                <a href="shalat.html" class="text-stone-500 hover:text-stone-900 transition-colors">Jadwal Shalat</a>
                <a href="doa.html" class="text-stone-900 transition-colors">Doa</a>
            </div>
        </div>
    </nav>

    <header class="w-full bg-white border-b border-stone-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 py-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-stone-900 mb-3">Kumpulan Doa Harian</h1>
            <p class="text-stone-500 uppercase tracking-widest text-sm">Doa sehari-hari bersumber dari Al-Qur'an dan As-Sunnah</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 md:px-6 py-12 w-full flex-grow">
        <div class="mb-10">
            <input type="text" id="input-cari-doa" placeholder="Cari doa berdasarkan nama atau grup..." class="w-full bg-white border border-stone-200 text-stone-900 rounded-sm px-5 py-4 focus:outline-none focus:border-stone-400 focus:ring-1 focus:ring-stone-400 shadow-sm transition-all placeholder:text-stone-400">
        </div>

        <div id="loading" class="text-stone-500 text-center animate-pulse mb-8">
            Memuat daftar doa...
        </div>

        <div id="konten-doa" class="columns-1 md:columns-2 gap-6 hidden">
        </div>
    </main>

    <script>
        const kontenDoa = document.getElementById('konten-doa');
        const loading = document.getElementById('loading');
        const inputCari = document.getElementById('input-cari-doa');
        let globalDoaData = [];

        document.addEventListener('DOMContentLoaded', fetchDoa);

        async function fetchDoa() {
            try {
                const response = await fetch('https://equran.id/api/doa');
                const result = await response.json();

                if(result.data) {
                    globalDoaData = result.data;
                    renderDoa(globalDoaData);
                }
            } catch (error) {
                console.error(error);
                kontenDoa.innerHTML = '<p class="text-red-700 text-center col-span-full">Gagal memuat kumpulan doa.</p>';
                kontenDoa.classList.remove('hidden');
                kontenDoa.classList.remove('md:columns-2', 'columns-1');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderDoa(dataList) {
            if (dataList.length === 0) {
                kontenDoa.innerHTML = '<div class="text-center p-8 bg-white border border-stone-200 rounded-sm shadow-sm break-inside-avoid w-full"><p class="text-stone-600">Tidak ada doa yang cocok dengan pencarian.</p></div>';
                kontenDoa.classList.remove('hidden');
                return;
            }

            let html = '';
            dataList.forEach(doa => {
                let tagHtml = '';
                if (doa.tag && doa.tag.length > 0) {
                    tagHtml = doa.tag.map(t => `<span class="bg-stone-100 text-stone-600 text-xs px-2 py-1 rounded-sm border border-stone-200 uppercase tracking-widest">${t}</span>`).join(' ');
                }

                html += `
                    <div class="bg-white p-6 md:p-8 rounded-sm shadow-sm border border-stone-200 mb-6 break-inside-avoid hover:shadow-md transition-shadow">
                        <div class="flex items-start justify-between gap-4 mb-4">
                            <h3 class="text-xl font-bold text-stone-900 leading-snug">${doa.nama}</h3>
                            <span class="text-stone-400 text-sm font-semibold shrink-0">#${doa.id}</span>
                        </div>
                        <p class="text-stone-500 text-sm mb-6 uppercase tracking-widest">${doa.grup}</p>

                        <div class="text-3xl font-arabic text-right leading-loose text-stone-900 mb-4" dir="rtl">
                            ${doa.ar}
                        </div>

                        <p class="text-stone-500 mb-3 italic leading-relaxed text-sm">${doa.tr}</p>
                        <p class="text-stone-800 leading-relaxed mb-6">${doa.idn}</p>

                        ${doa.tentang ? `<div class="bg-stone-50 p-4 border border-stone-100 rounded-sm text-xs text-stone-600 leading-relaxed mb-4">${doa.tentang}</div>` : ''}

                        ${tagHtml ? `<div class="flex flex-wrap gap-2">${tagHtml}</div>` : ''}
                    </div>
                `;
            });

            kontenDoa.innerHTML = html;
            kontenDoa.classList.remove('hidden');
        }

        inputCari.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = globalDoaData.filter(doa =>
                doa.nama.toLowerCase().includes(query) ||
                doa.grup.toLowerCase().includes(query) ||
                (doa.tag && doa.tag.some(t => t.toLowerCase().includes(query))) ||
                doa.idn.toLowerCase().includes(query)
            );
            renderDoa(filtered);
        });
    </script>
</body>
</html>
